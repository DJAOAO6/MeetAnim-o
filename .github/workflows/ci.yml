# Intégration continue — vérifie chaque poussée et chaque demande de fusion.
#
# Deux travaux :
#
# - typage, lint et tests unitaires : tout ce qui tourne sans base ;
# - cloisonnement entre cabinets : la promesse « un professionnel ne voit que
#   ses données ». Elle tourne sur un PostgreSQL éphémère, créé et détruit
#   avec le travail — le dépôt est public, aucune base réelle n'y est donc
#   exposée. Le reste de la suite E2E reste lancé localement : elle est
#   longue, et sa valeur ne justifie pas encore ce temps à chaque poussée.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verifier:
    name: Typage, lint, tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # prisma generate lit la configuration mais ne se connecte à rien :
      # une adresse factice suffit.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Client Prisma
        run: npx prisma generate

      # Types des routes (PageProps, LayoutProps…) et next-env.d.ts :
      # générés par `next dev` sur un poste, absents d'un dépôt fraîchement
      # cloné. Sans eux, le typage échoue sur des types qui n'existent pas.
      - name: Types des routes Next.js
        run: npx next typegen

      - name: Typage
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src tests tests-unit

      - name: Tests unitaires
        run: npm run test:unit

  cloisonnement:
    name: Cloisonnement entre cabinets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: animeo_ci
          # UTC, comme la production : des colonnes de date sans fuseau lues
          # dans un autre fuseau décalent les comparaisons (voir
          # scripts/test-db.mjs).
          TZ: UTC
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/animeo_ci
      # Secrets jetables : cette base et ce serveur n'existent que le temps
      # du travail.
      SESSION_SECRET: integration-continue-secret-de-test-32-caracteres
      CRON_SECRET: integration-continue-cron
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      E2E_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Client Prisma
        run: npx prisma generate

      - name: Types des routes Next.js
        run: npx next typegen

      - name: Migrations
        run: npx prisma migrate deploy

      - name: Données de démonstration
        run: npx tsx prisma/seed.ts

      - name: Navigateur de test
        run: npx playwright install --with-deps chromium

      # Playwright démarre le serveur lui-même (voir playwright.config.ts).
      # Serveur de développement, et non un build : la suite « identifiants
      # en main » retrouve les actions par leur nom dans le JavaScript servi,
      # et un build ne publie pas ces noms — ce qui est tant mieux pour la
      # production, mais rendrait la suite aveugle ici.
      - name: Cloisonnement
        run: npx playwright test tests/organization-isolation.spec.ts tests/organization-isolation-actions.spec.ts --reporter=line

      - name: Traces des échecs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-cloisonnement
          path: test-results/
          retention-days: 7
