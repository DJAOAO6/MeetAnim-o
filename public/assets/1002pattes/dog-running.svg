<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" fill="none">
  <!-- Teckel 1002 Pattes, de profil, qui court vers la droite. -->
  <style>
    .part { transform-box: fill-box; }
    #tail { transform-origin: 100% 90%; animation: tail 0.36s ease-in-out infinite alternate; }
    #ear { transform-origin: 50% 5%; animation: ear 0.36s ease-in-out infinite alternate; }
    #front-legs { transform-origin: 10% 10%; animation: front 0.36s ease-in-out infinite alternate; }
    #back-legs { transform-origin: 90% 10%; animation: back 0.36s ease-in-out infinite alternate; }
    @keyframes tail { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
    @keyframes ear { from { transform: rotate(-3deg); } to { transform: rotate(4deg); } }
    @keyframes front { from { transform: rotate(-10deg); } to { transform: rotate(8deg); } }
    @keyframes back { from { transform: rotate(8deg); } to { transform: rotate(-10deg); } }
    @media (prefers-reduced-motion: reduce) {
      #tail, #ear, #front-legs, #back-legs { animation: none; }
    }
  </style>
  <g id="tail" class="part">
    <path d="M70 86 C48 80 34 62 38 40 C40 30 50 28 53 36 C50 54 58 68 78 76 Z" fill="#C0602A"/>
  </g>
  <g id="back-legs" class="part">
    <!-- Patte arrière du fond, plus sombre, puis patte arrière visible. -->
    <path d="M86 100 C74 108 62 116 52 122 L60 134 C72 128 86 120 98 112 Z" fill="#A24C1B"/>
    <ellipse cx="52" cy="129" rx="13" ry="9" fill="#A24C1B" transform="rotate(-20 52 129)"/>
    <path d="M48 124 q-3 3 -3 7 M54 122 q-3 3 -3 7" stroke="#4A2412" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M98 104 C92 116 84 128 74 138 L90 148 C100 138 110 126 120 114 Z" fill="#C0602A"/>
    <ellipse cx="80" cy="146" rx="14" ry="10" fill="#C0602A" transform="rotate(-30 80 146)"/>
    <path d="M74 143 q-3 3 -2 7 M81 140 q-3 3 -2 7" stroke="#4A2412" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <g id="body" class="part">
    <path d="M64 96 C60 80 74 72 98 74 C130 77 166 80 196 72 C212 67 222 60 230 52 L252 92 C242 108 222 118 192 121 C152 126 112 125 88 120 C72 117 66 108 64 96 Z" fill="#C0602A"/>
  </g>
  <g id="front-legs" class="part">
    <!-- Patte avant du fond, plus sombre, puis patte avant visible. -->
    <path d="M196 106 C210 114 224 120 238 122 L236 134 C220 132 204 126 190 118 Z" fill="#A24C1B"/>
    <ellipse cx="244" cy="128" rx="13" ry="9" fill="#A24C1B" transform="rotate(10 244 128)"/>
    <path d="M246 123 q3 3 3 7 M252 125 q3 3 2 7" stroke="#4A2412" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M208 94 C226 96 244 94 258 90 L262 106 C246 110 228 114 210 114 Z" fill="#C0602A"/>
    <ellipse cx="266" cy="99" rx="14" ry="10" fill="#C0602A" transform="rotate(-8 266 99)"/>
    <path d="M267 93 q3 3 3 8 M274 94 q3 3 2 8" stroke="#4A2412" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <g id="head" class="part">
    <path d="M222 66 C222 36 244 20 266 24 C278 26 286 32 292 36 C300 38 308 38 314 42 C322 48 318 62 306 64 C296 66 288 70 276 74 C258 82 236 84 226 76 Z" fill="#C0602A"/>
    <path d="M300 58 C290 64 276 68 262 68" stroke="#4A2412" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M262 42 C265 36 273 36 276 42" stroke="#4A2412" stroke-width="3.2" stroke-linecap="round"/>
    <ellipse cx="308" cy="45" rx="9" ry="7" fill="#4A2412"/>
    <ellipse cx="309" cy="42.5" rx="2.6" ry="1.7" fill="#C98A6E"/>
    <g id="ear" class="part">
      <path d="M250 32 C236 40 226 66 228 88 C230 102 246 106 252 94 C258 80 258 52 256 36 Z" fill="#4A2412"/>
      <path d="M255 36 C258 54 259 78 253 94" stroke="#F2B48C" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>
